<style>body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center}.c{max-width:420px;width:100%;padding:40px 28px}.c img{width:96px;height:96px;border-radius:24px;margin:0 auto;box-shadow:0 16px 40px -12px rgba(193,38,211,.6)}.c h1{font-size:clamp(32px,8vw,40px);margin:26px 0 12px}.c p{margin:0}.c .btn{width:100%;margin-top:28px}.bar{height:3px;border-radius:3px;background:var(--bd);margin-top:22px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--grad);transform-origin:left;animation:fill 1.5s linear forwards}@keyframes fill{from{transform:scaleX(0)}}</style></head>
<body><div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div><div class="grain" aria-hidden="true"></div>
<main class="card c"><img src="logo-256.png" alt="TextTune"><h1>No worries!</h1><p class="lead" style="margin:0 auto">Your preview is still in your messages.</p>
<a class="btn p" id="back" href="sms:+12138537848">Back to TextTune 💬</a><div class="bar" aria-hidden="true"><i></i></div><p class="small" style="margin-top:12px">Returning you to Messages…</p></main>
<script>// Number configurable via ?to=+1XXXXXXXXXX
var t=new URLSearchParams(location.search).get("to");if(t&&/^\+?[0-9]{7,15}$/.test(t))document.getElementById("back").href="sms:"+t;
